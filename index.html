<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cinematic Black Hole Fly-In</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      overscroll-behavior: none;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    canvas { display: block; }
    #hud {
      position: fixed;
      left: 12px;
      top: 10px;
      z-index: 10;
      color: rgba(255,255,255,.75);
      font-size: 13px;
      text-shadow: 0 1px 2px rgba(0,0,0,.9);
      pointer-events: none;
      user-select: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="hud">Black hole fly-in | мышь/тач — вращение после пролёта | R — replay</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const TAU = Math.PI * 2;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000007);
    scene.fog = new THREE.FogExp2(0x000007, 0.00085);

    const camera = new THREE.PerspectiveCamera(56, window.innerWidth / window.innerHeight, 0.1, 9000);
    camera.position.set(0, 18, 980);

    const renderer = new THREE.WebGLRenderer({
      antialias: false,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.65));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    renderer.domElement.style.touchAction = 'none';
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enabled = false;
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = false;
    controls.minDistance = 42;
    controls.maxDistance = 1500;
    controls.target.set(0, 0, 0);

    const clock = new THREE.Clock();
    const pointer = new THREE.Vector2(0, 0);

    window.addEventListener('pointermove', (e) => {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -((e.clientY / window.innerHeight) * 2 - 1);
    }, { passive: true });

    function easeInOutCubic(t) {
      return t < 0.5 ? 4.0 * t * t * t : 1.0 - Math.pow(-2.0 * t + 2.0, 3.0) / 2.0;
    }

    function clamp01(x) {
      return Math.max(0, Math.min(1, x));
    }

    function makeStarField(count = 7000) {
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const sizes = new Float32Array(count);
      const twinkles = new Float32Array(count);
      const c = new THREE.Color();

      for (let i = 0; i < count; i++) {
        const u = Math.random() * 2 - 1;
        const theta = Math.random() * TAU;
        const r = 1300 + Math.pow(Math.random(), 0.4) * 4200;
        const s = Math.sqrt(1 - u * u);

        positions[i * 3 + 0] = r * s * Math.cos(theta);
        positions[i * 3 + 1] = r * u;
        positions[i * 3 + 2] = r * s * Math.sin(theta);

        const m = Math.random();
        if (m < 0.72) c.setHSL(0.57 + Math.random() * 0.08, 0.18 + Math.random() * 0.15, 0.78 + Math.random() * 0.16);
        else if (m < 0.93) c.setHSL(0.08 + Math.random() * 0.07, 0.26 + Math.random() * 0.12, 0.83 + Math.random() * 0.12);
        else c.setHSL(0.0, 0.0, 1.0);

        colors[i * 3 + 0] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;

        sizes[i] = 0.8 + Math.random() * 2.6;
        twinkles[i] = 0.4 + Math.random() * 2.9;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
      geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
      geo.setAttribute('aTwinkle', new THREE.BufferAttribute(twinkles, 1));

      const mat = new THREE.ShaderMaterial({
        uniforms: {
          time: { value: 0 }
        },
        vertexShader: `
          attribute vec3 aColor;
          attribute float aSize;
          attribute float aTwinkle;
          uniform float time;
          varying vec3 vColor;
          void main() {
            vColor = aColor;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            float pulse = 0.72 + 0.28 * sin(time * aTwinkle + position.x * 0.002 + position.y * 0.0015);
            gl_PointSize = aSize * pulse * (220.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          precision highp float;
          varying vec3 vColor;
          void main() {
            vec2 p = gl_PointCoord - 0.5;
            float d = length(p);
            float a = smoothstep(0.5, 0.0, d);
            if (a < 0.01) discard;
            gl_FragColor = vec4(vColor, a);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      const points = new THREE.Points(geo, mat);
      scene.add(points);
      return points;
    }

    function createSpiralGalaxy({
      count = 30000,
      size = 150,
      branches = 4,
      spin = 0.04,
      randomness = 0.45,
      centerColor = 0xffd7a1,
      edgeColor = 0x4d96ff,
      opacity = 0.82
    }) {
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);

      const c1 = new THREE.Color(centerColor);
      const c2 = new THREE.Color(edgeColor);
      const col = new THREE.Color();

      for (let i = 0; i < count; i++) {
        const radius = Math.pow(Math.random(), 0.5) * size;
        const branchAngle = ((i % branches) / branches) * TAU;
        const spinAngle = radius * spin;

        const randomX = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * randomness * radius;
        const randomY = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * randomness * radius * 0.28;
        const randomZ = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * randomness * radius;

        positions[i * 3 + 0] = Math.cos(branchAngle + spinAngle) * radius + randomX;
        positions[i * 3 + 1] = randomY;
        positions[i * 3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

        col.copy(c1).lerp(c2, radius / size);
        colors[i * 3 + 0] = col.r;
        colors[i * 3 + 1] = col.g;
        colors[i * 3 + 2] = col.b;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const mat = new THREE.PointsMaterial({
        size: 0.85,
        vertexColors: true,
        transparent: true,
        opacity,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        sizeAttenuation: true
      });

      const points = new THREE.Points(geo, mat);
      return points;
    }

    function createDustRing({
      count = 4200,
      inner = 16,
      outer = 170,
      height = 18,
      size = 0.68,
      opacity = 0.48,
      warm = 0xffb864,
      cool = 0x5b9eff,
      speedMul = 1.0
    }) {
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);

      const radii = new Float32Array(count);
      const angles = new Float32Array(count);
      const speeds = new Float32Array(count);
      const yOffsets = new Float32Array(count);

      const c = new THREE.Color();
      const warmC = new THREE.Color(warm);
      const coolC = new THREE.Color(cool);

      for (let i = 0; i < count; i++) {
        const t = Math.pow(Math.random(), 0.6);
        radii[i] = inner + (outer - inner) * t;
        angles[i] = Math.random() * TAU;
        speeds[i] = (0.18 + Math.random() * 1.25) * speedMul;
        yOffsets[i] = (Math.random() - 0.5) * height;

        c.copy(warmC).lerp(coolC, Math.random());
        colors[i * 3 + 0] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const mat = new THREE.PointsMaterial({
        size,
        vertexColors: true,
        transparent: true,
        opacity,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        sizeAttenuation: true
      });

      const points = new THREE.Points(geo, mat);

      return {
        points,
        geo,
        positions,
        radii,
        angles,
        speeds,
        yOffsets
      };
    }

    function updateDustRing(dust, delta, time) {
      const pos = dust.positions;
      const count = dust.radii.length;

      for (let i = 0; i < count; i++) {
        const r = dust.radii[i];
        dust.angles[i] += delta * dust.speeds[i] * (0.2 + 10.0 / (r + 18.0));

        const wobble = Math.sin(time * 0.85 + i * 0.017) * 0.7;
        pos[i * 3 + 0] = Math.cos(dust.angles[i]) * r;
        pos[i * 3 + 1] = dust.yOffsets[i] * 0.55 + wobble;
        pos[i * 3 + 2] = Math.sin(dust.angles[i]) * r;
      }

      dust.geo.attributes.position.needsUpdate = true;
    }

    function makeNebulaCloud(count = 2600) {
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const sizes = new Float32Array(count);
      const c = new THREE.Color();

      for (let i = 0; i < count; i++) {
        const theta = Math.random() * TAU;
        const phi = Math.acos(THREE.MathUtils.randFloat(-1, 1));
        const r = 210 + Math.random() * 950;

        positions[i * 3 + 0] = Math.sin(phi) * Math.cos(theta) * r;
        positions[i * 3 + 1] = Math.cos(phi) * r * 0.42;
        positions[i * 3 + 2] = Math.sin(phi) * Math.sin(theta) * r;

        const m = Math.random();
        if (m < 0.55) c.setHex(0x3c59ff);
        else if (m < 0.88) c.setHex(0xff8d48);
        else c.setHex(0xffffff);

        colors[i * 3 + 0] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;
        sizes[i] = 12 + Math.random() * 32;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));

      const mat = new THREE.ShaderMaterial({
        uniforms: { time: { value: 0 } },
        vertexShader: `
          attribute float aSize;
          attribute vec3 color;
          uniform float time;
          varying vec3 vColor;
          varying float vAlpha;
          void main() {
            vColor = color;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            float pulse = 0.7 + 0.3 * sin(time * 0.35 + position.x * 0.002 + position.z * 0.002);
            gl_PointSize = aSize * pulse * (175.0 / -mvPosition.z);
            vAlpha = 0.12 + 0.15 * pulse;
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          precision highp float;
          varying vec3 vColor;
          varying float vAlpha;
          void main() {
            vec2 p = gl_PointCoord - 0.5;
            float d = length(p);
            float a = smoothstep(0.5, 0.0, d) * vAlpha;
            if (a < 0.004) discard;
            gl_FragColor = vec4(vColor, a);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      const points = new THREE.Points(geo, mat);
      scene.add(points);

      return { points, material: mat };
    }

    function createBlackHole() {
      const group = new THREE.Group();
      scene.add(group);

      const coreRadius = 34.0;

      const core = new THREE.Mesh(
        new THREE.SphereGeometry(coreRadius, 80, 80),
        new THREE.MeshBasicMaterial({ color: 0x000000 })
      );
      group.add(core);

      const coreShadow = new THREE.Mesh(
        new THREE.SphereGeometry(coreRadius * 1.18, 80, 80),
        new THREE.MeshBasicMaterial({
          color: 0x000000,
          transparent: true,
          opacity: 0.97
        })
      );
      group.add(coreShadow);

      const halo = new THREE.Mesh(
        new THREE.SphereGeometry(coreRadius * 1.55, 64, 64),
        new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          side: THREE.BackSide,
          blending: THREE.AdditiveBlending,
          uniforms: {
            time: { value: 0 },
            colorA: { value: new THREE.Color(0x75bcff) },
            colorB: { value: new THREE.Color(0xff9850) }
          },
          vertexShader: `
            varying vec3 vNormalW;
            varying vec3 vPosW;
            void main() {
              vNormalW = normalize(normalMatrix * normal);
              vec4 worldPos = modelMatrix * vec4(position, 1.0);
              vPosW = worldPos.xyz;
              gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
          `,
          fragmentShader: `
            precision highp float;
            uniform float time;
            uniform vec3 colorA;
            uniform vec3 colorB;
            varying vec3 vNormalW;
            varying vec3 vPosW;

            void main() {
              vec3 viewDir = normalize(cameraPosition - vPosW);
              float fresnel = pow(1.0 - max(dot(normalize(vNormalW), viewDir), 0.0), 3.5);
              float pulse = 0.55 + 0.45 * sin(time * 1.1 + vPosW.y * 0.12);
              vec3 col = mix(colorA, colorB, 0.5 + 0.5 * sin(time * 0.65));
              col *= fresnel * (0.22 + pulse * 0.65);
              gl_FragColor = vec4(col, fresnel * 0.75);
            }
          `
        })
      );
      group.add(halo);

      const outerGlow = new THREE.Mesh(
        new THREE.SphereGeometry(coreRadius * 2.4, 64, 64),
        new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          side: THREE.BackSide,
          blending: THREE.AdditiveBlending,
          uniforms: {
            time: { value: 0 },
            glowColor: { value: new THREE.Color(0x3350ff) }
          },
          vertexShader: `
            varying vec3 vNormalW;
            varying vec3 vPosW;
            void main() {
              vNormalW = normalize(normalMatrix * normal);
              vec4 worldPos = modelMatrix * vec4(position, 1.0);
              vPosW = worldPos.xyz;
              gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
          `,
          fragmentShader: `
            precision highp float;
            uniform float time;
            uniform vec3 glowColor;
            varying vec3 vNormalW;
            varying vec3 vPosW;

            void main() {
              vec3 viewDir = normalize(cameraPosition - vPosW);
              float fresnel = pow(1.0 - max(dot(normalize(vNormalW), viewDir), 0.0), 4.2);
              float pulse = 0.4 + 0.6 * sin(time * 0.92 + vPosW.x * 0.03);
              vec3 col = glowColor * fresnel * (0.08 + pulse * 0.35);
              gl_FragColor = vec4(col, fresnel * 0.33);
            }
          `
        })
      );
      group.add(outerGlow);

      const photonRing = new THREE.Mesh(
        new THREE.TorusGeometry(coreRadius * 1.85, 3.8, 24, 240),
        new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide,
          blending: THREE.AdditiveBlending,
          uniforms: {
            time: { value: 0 },
            colorA: { value: new THREE.Color(0xffd08c) },
            colorB: { value: new THREE.Color(0xff7d2e) }
          },
          vertexShader: `
            varying vec2 vUv;
            varying vec3 vPos;
            void main() {
              vUv = uv;
              vPos = position;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            precision highp float;
            varying vec2 vUv;
            varying vec3 vPos;
            uniform float time;
            uniform vec3 colorA;
            uniform vec3 colorB;

            float hash(vec2 p) {
              return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
            }

            void main() {
              float band = 0.5 + 0.5 * sin(vUv.x * 84.0 + time * 4.6 + vPos.y * 5.0);
              float band2 = 0.5 + 0.5 * sin(vUv.y * 23.0 - time * 2.9);
              float noise = hash(vUv * 130.0 + time * 0.03);
              vec3 col = mix(colorA, colorB, 0.35 + 0.35 * band);
              col += vec3(1.0, 0.68, 0.25) * noise * 0.1;
              float alpha = (0.45 + 0.55 * band) * (0.55 + 0.45 * band2);
              gl_FragColor = vec4(col, alpha * 0.95);
            }
          `
        })
      );
      photonRing.rotation.x = Math.PI / 2.35;
      photonRing.rotation.z = 0.26;
      group.add(photonRing);

      const diskOuter = new THREE.Mesh(
        new THREE.RingGeometry(coreRadius * 1.18, coreRadius * 5.0, 256, 1),
        new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide,
          blending: THREE.AdditiveBlending,
          uniforms: {
            time: { value: 0 },
            warmColor: { value: new THREE.Color(0xffaf59) },
            coolColor: { value: new THREE.Color(0x5998ff) },
            opacityStrength: { value: 0.94 }
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            precision highp float;
            varying vec2 vUv;
            uniform float time;
            uniform vec3 warmColor;
            uniform vec3 coolColor;
            uniform float opacityStrength;

            float hash(vec2 p) {
              return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
            }

            float noise(vec2 p) {
              vec2 i = floor(p);
              vec2 f = fract(p);
              float a = hash(i);
              float b = hash(i + vec2(1.0, 0.0));
              float c = hash(i + vec2(0.0, 1.0));
              float d = hash(i + vec2(1.0, 1.0));
              vec2 u = f * f * (3.0 - 2.0 * f);
              return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
            }

            void main() {
              vec2 p = vUv * 2.0 - 1.0;
              p.x *= 1.1;
              float r = length(p);

              float a = atan(p.y, p.x);
              float n = noise(p * 7.0 + vec2(time * 0.12, -time * 0.08));
              a += time * 0.28 / (r + 0.09);

              float spiral = sin(r * 38.0 - time * 3.8 + a * 12.0 + n * 4.5);
              float spiral2 = sin(r * 11.0 + time * 2.2 - a * 7.0);
              float bands = max(0.0, (0.52 + 0.48 * spiral) * (0.7 + 0.3 * spiral2));

              float innerGlow = exp(-pow((r - 0.26) / 0.07, 2.0));
              float outerGlow = exp(-pow((r - 0.92) / 0.14, 2.0));

              float alpha = smoothstep(1.0, 0.22, r);
              alpha *= opacityStrength;

              vec3 col = mix(warmColor, coolColor, smoothstep(0.18, 1.0, r));
              col += warmColor * pow(bands, 3.0) * 1.5;
              col += vec3(1.0, 0.75, 0.35) * innerGlow * 2.2;
              col += vec3(0.18, 0.42, 1.0) * outerGlow * 0.7;
              col *= 1.0 + n * 0.18;

              gl_FragColor = vec4(col, alpha * bands);
            }
          `
        })
      );
      diskOuter.rotation.x = -Math.PI / 2;
      diskOuter.rotation.z = 0.16;
      group.add(diskOuter);

      const diskInner = new THREE.Mesh(
        new THREE.RingGeometry(coreRadius * 0.82, coreRadius * 3.0, 256, 1),
        new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide,
          blending: THREE.AdditiveBlending,
          uniforms: {
            time: { value: 0 },
            warmColor: { value: new THREE.Color(0xffe0b8) },
            coolColor: { value: new THREE.Color(0x8dbdff) },
            opacityStrength: { value: 1.0 }
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            precision highp float;
            varying vec2 vUv;
            uniform float time;
            uniform vec3 warmColor;
            uniform vec3 coolColor;
            uniform float opacityStrength;

            float hash(vec2 p) {
              return fract(sin(dot(p, vec2(13.7, 91.4))) * 43758.5453);
            }

            float noise(vec2 p) {
              vec2 i = floor(p);
              vec2 f = fract(p);
              float a = hash(i);
              float b = hash(i + vec2(1.0, 0.0));
              float c = hash(i + vec2(0.0, 1.0));
              float d = hash(i + vec2(1.0, 1.0));
              vec2 u = f * f * (3.0 - 2.0 * f);
              return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
            }

            void main() {
              vec2 p = vUv * 2.0 - 1.0;
              p.x *= 1.08;
              float r = length(p);

              float a = atan(p.y, p.x);
              float n = noise(p * 10.0 + vec2(time * 0.17, time * 0.06));
              a += time * 0.54 / (r + 0.08);

              float spiral = sin(r * 50.0 - time * 5.0 + a * 14.0 + n * 6.0);
              float bands = max(0.0, 0.48 + 0.52 * spiral);

              float coreGlow = exp(-pow((r - 0.18) / 0.04, 2.0));
              float rimGlow = exp(-pow((r - 0.96) / 0.12, 2.0));

              float alpha = smoothstep(1.0, 0.18, r);
              alpha *= opacityStrength;

              vec3 col = mix(warmColor, coolColor, smoothstep(0.08, 1.0, r));
              col += warmColor * pow(bands, 3.2) * 1.7;
              col += vec3(1.0, 0.8, 0.4) * coreGlow * 2.0;
              col += vec3(0.25, 0.45, 1.0) * rimGlow * 0.55;

              gl_FragColor = vec4(col, alpha * bands);
            }
          `
        })
      );
      diskInner.rotation.x = -Math.PI / 2;
      diskInner.rotation.z = -0.23;
      diskInner.position.y = 0.2;
      group.add(diskInner);

      const tinyPointLight = new THREE.PointLight(0xff9e52, 3.7, 360, 2);
      tinyPointLight.position.set(0, 0, 0);
      group.add(tinyPointLight);

      return {

    function createWarpStreaks(count = 900) {
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 2 * 3);
      const colors = new Float32Array(count * 2 * 3);
      const dirs = [];
      const speeds = [];
      const phases = [];
      const lengths = [];

      const c1 = new THREE.Color(0x93c7ff);
      const c2 = new THREE.Color(0xffffff);

      for (let i = 0; i < count; i++) {
        const dir = new THREE.Vector3(
          (Math.random() - 0.5) * 2,
          (Math.random() - 0.5) * 2,
          (Math.random() - 0.5) * 2
        ).normalize();

        dirs.push(dir);
        speeds.push(0.35 + Math.random() * 1.8);
        phases.push(Math.random());
        lengths.push(18 + Math.random() * 90);

        const col = c1.clone().lerp(c2, Math.random());
        colors[i * 6 + 0] = col.r;
        colors[i * 6 + 1] = col.g;
        colors[i * 6 + 2] = col.b;
        colors[i * 6 + 3] = col.r;
        colors[i * 6 + 4] = col.g;
        colors[i * 6 + 5] = col.b;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const mat = new THREE.LineBasicMaterial({
        vertexColors: true,
        transparent: true,
        opacity: 0.18,
        blending: THREE.AdditiveBlending
      });

      const lines = new THREE.LineSegments(geo, mat);
      scene.add(lines);

      return { lines, geo, positions, dirs, speeds, phases, lengths };
    }

    function updateWarpStreaks(warp, time, intensity) {
      const pos = warp.positions;
      for (let i = 0; i < warp.dirs.length; i++) {
        const dir = warp.dirs[i];
        const t = (time * warp.speeds[i] * (0.55 + intensity * 1.25) + warp.phases[i]) % 1.0;
        const base = 24 + t * (180 + intensity * 540);
        const len = warp.lengths[i] * (0.5 + intensity * 1.2);

        const start = dir.clone().multiplyScalar(base);
        const end = dir.clone().multiplyScalar(base + len);

        const o = i * 6;
        pos[o + 0] = start.x;
        pos[o + 1] = start.y;
        pos[o + 2] = start.z;
        pos[o + 3] = end.x;
        pos[o + 4] = end.y;
        pos[o + 5] = end.z;
      }
      warp.geo.attributes.position.needsUpdate = true;
    }

            varying vec3 vNormalW;

          `,
          fragmentShader: `

              float fresnel = pow(1.0 - max(dot(normalize(vNormalW), viewDir), 0.0), 3.8);
              float pulse = 0.55 + 0.45 * sin(time * 0.95 + length(vPosW) * 0.01);
              vec3 col = color * fresnel * (0.2 + pulse * 0.26);

    function createWormholeTunnel() {
      const geo = new THREE.CylinderGeometry(128, 128, 980, 128, 1, true);
      const mat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending,
        uniforms: {
          time: { value: 0 }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          precision highp float;
          varying vec2 vUv;
          uniform float time;

          float hash(vec2 p) {
            return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
          }

          void main() {
            vec2 p = vUv * 2.0 - 1.0;
            p.x *= 1.35;

            float r = length(p);
            float a = atan(p.y, p.x);

            float tunnel = smoothstep(1.0, 0.14, r);
            float swirl = sin(a * 16.0 + time * 4.8 + r * 14.0);
            float bands = 0.45 + 0.55 * sin(vUv.y * 42.0 - time * 6.2 + swirl * 1.5);
            float bands2 = 0.5 + 0.5 * sin(r * 34.0 - time * 3.0 + a * 8.0);

            float speck = hash(vUv * 160.0 + time * 0.01);
            float stars = smoothstep(0.985, 1.0, speck) * 0.9;

            vec3 c1 = vec3(0.1, 0.22, 0.95);
            vec3 c2 = vec3(1.0, 0.5, 0.16);
            vec3 col = mix(c1, c2, 0.5 + 0.5 * swirl);
            col += vec3(1.0, 0.75, 0.35) * pow(bands, 3.0) * 0.7;
            col += vec3(0.6, 0.85, 1.0) * stars * 0.9;
            col *= tunnel * (0.55 + 0.45 * bands2);

            float alpha = tunnel * (0.35 + 0.65 * bands2);
            gl_FragColor = vec4(col, alpha * 0.7);
          }
        `
      });

      const tunnel = new THREE.Mesh(geo, mat);
      tunnel.position.set(0, 0, -970);
      tunnel.rotation.x = Math.PI * 0.5;
      tunnel.rotation.z = 0.22;
      scene.add(tunnel);

      const halo = new THREE.Mesh(
        new THREE.TorusGeometry(128, 6.5, 24, 180),
        new THREE.MeshBasicMaterial({
          color: 0x6fb5ff,
          transparent: true,
          opacity: 0.18,
          blending: THREE.AdditiveBlending
        })
      );
      halo.position.copy(tunnel.position);
      halo.rotation.copy(tunnel.rotation);
      scene.add(halo);

      return { tunnel, halo };
    }

    const keyLight = new THREE.PointLight(0xffa65a, 4.8, 1100, 2);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      1.38,
      0.8,
      0.06
    );
    composer.addPass(bloomPass);

    const lensPass = new ShaderPass({
      uniforms: {
        tDiffuse: { value: null },
        time: { value: 0 },
        bhPower: { value: 0.0 },
        warpPower: { value: 0.0 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        precision highp float;
        uniform sampler2D tDiffuse;
        uniform float time;
        uniform float bhPower;
        uniform float warpPower;
        varying vec2 vUv;

        void main() {
          vec2 uv = vUv;
          vec2 c = vec2(0.5, 0.5);
          vec2 p = uv - c;

          float r = length(p);
          float lens = bhPower / (r * r + 0.05);
          float twist = warpPower / (r + 0.04);

          float a = atan(p.y, p.x) + twist * 0.08;
          vec2 dir = vec2(cos(a), sin(a));
          vec2 warped = c + dir * (r * (1.0 + lens));

          vec3 col;
          col.r = texture2D(tDiffuse, warped + p * 0.0024).r;
          col.g = texture2D(tDiffuse, warped).g;
          col.b = texture2D(tDiffuse, warped - p * 0.0024).b;

          float vignette = smoothstep(1.05, 0.16, r);
          col *= vignette;

          float grain = fract(sin(dot(gl_FragCoord.xy + time * 60.0, vec2(12.9898, 78.233))) * 43758.5453) - 0.5;
          col += grain * 0.008;

          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    composer.addPass(lensPass);

    const sequence = {
      startTime: 0,
      duration: 22.0,
      done: false,
      reset() {
        this.startTime = clock.getElapsedTime();
        this.done = false;
        controls.enabled = false;
        controls.autoRotate = false;
      }
    };
    sequence.reset();

    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'r') sequence.reset();
    });

    const cameraPath = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 16, 980),
      new THREE.Vector3(0, 18, 720),
      new THREE.Vector3(-26, 20, 520),
      new THREE.Vector3(22, 18, 330),
      new THREE.Vector3(0, 12, 190),
      new THREE.Vector3(0, 5, 120),
      new THREE.Vector3(0, 0, 78),
      new THREE.Vector3(0, 0, 50),
      new THREE.Vector3(0, 0, 40)
    ], false, 'catmullrom', 0.5);

    function updateCameraFlyIn(localT, time) {
      const t = easeInOutCubic(clamp01(localT));
      const p = cameraPath.getPointAt(t);
      const tangent = cameraPath.getTangentAt(t).normalize();

      camera.position.copy(p);

      const wobble = 1.0 - t;
      camera.position.x += Math.sin(time * 3.0) * 4.5 * wobble;
      camera.position.y += Math.cos(time * 2.3) * 3.0 * wobble;
      camera.position.z += Math.sin(time * 1.5) * 1.2 * wobble;

      const target = new THREE.Vector3(
        Math.sin(time * 0.18) * 1.8 * wobble,
        Math.cos(time * 0.14) * 1.1 * wobble,
        0
      );

      camera.lookAt(target);

      const fov = THREE.MathUtils.lerp(58, 84, t);
      camera.fov = fov;
      camera.updateProjectionMatrix();

      return { t, tangent };
    }

    function animate() {
      requestAnimationFrame(animate);

      const time = clock.elapsedTime;
      const delta = clock.getDelta();

      const elapsed = time - sequence.startTime;
      const rawT = elapsed / sequence.duration;
      const seqT = clamp01(rawT);
      const fly = easeInOutCubic(seqT);

      const cinematic = seqT < 1.0;
      if (cinematic) {
        const { t } = updateCameraFlyIn(seqT, time);
        controls.enabled = false;

        // Scene zoom / impact during the dive
        const warpIntensity = Math.max(0, (t - 0.12) / 0.88);
        const bhIntensity = Math.max(0, (t - 0.28) / 0.72);

        blackHole.group.rotation.y += delta * (0.08 + bhIntensity * 0.22);
        blackHole.diskOuter.rotation.z += delta * (0.18 + bhIntensity * 0.5);
        blackHole.diskInner.rotation.z -= delta * (0.24 + bhIntensity * 0.75);
        blackHole.photonRing.rotation.z += delta * (0.08 + bhIntensity * 0.2);

        blackHole.halo.material.uniforms.time.value = time;
        blackHole.outerGlow.material.uniforms.time.value = time;
        blackHole.photonRing.material.uniforms.time.value = time;
        blackHole.diskOuter.material.uniforms.time.value = time;
        blackHole.diskInner.material.uniforms.time.value = time;

        nebula.material.uniforms.time.value = time;
        nebula.points.rotation.y += delta * 0.015;
        nebula.points.rotation.x += delta * 0.004;

        stars.rotation.y = time * 0.012;
        stars.rotation.x = Math.sin(time * 0.03) * 0.008;

        updateDustRing(dustRing, delta, time * (1.0 + bhIntensity * 0.4));
        dustRing.points.rotation.y += delta * 0.06;
        dustRing.points.rotation.x += delta * 0.015;

        updateWarpStreaks(warpStreaks, time, warpIntensity);
        warpStreaks.lines.rotation.y += delta * (0.08 + warpIntensity * 0.15);
        warpStreaks.lines.rotation.x += delta * 0.03;

        // Background objects moving subtly
        galaxyA.group.rotation.y += delta * 0.02;
        galaxyA.galaxy.rotation.z += delta * 0.03;
        galaxyB.group.rotation.y -= delta * 0.018;
        galaxyB.galaxy.rotation.z -= delta * 0.04;

        dyson.group.rotation.y += delta * 0.1;
        dyson.group.rotation.x += delta * 0.045;
        dyson.star.scale.setScalar(1.0 + Math.sin(time * 2.4) * 0.018);
        dyson.starLight.intensity = 7.2 + Math.sin(time * 1.7) * 0.7;
        dyson.shell.rotation.y -= delta * 0.04;
        dyson.ring1.rotation.z += delta * 0.08;
        dyson.ring2.rotation.z -= delta * 0.06;

        horror.group.rotation.y += delta * 0.05;
        horror.group.rotation.x += delta * 0.02;
        horror.eye1.intensity = 1.3 + Math.sin(time * 3.1) * 0.45;
        horror.eye2.intensity = 1.3 + Math.cos(time * 2.7) * 0.45;
        horror.aura.material.uniforms.time.value = time;

        for (const d of debris.debris) {
          d.mesh.rotateOnAxis(d.axis, delta * d.speed * 0.45);
          d.mesh.position.x += Math.sin(time * 0.2 + d.phase) * 0.006;
          d.mesh.position.y += Math.cos(time * 0.17 + d.phase) * 0.006;
          d.mesh.position.z += Math.sin(time * 0.19 + d.phase) * 0.006;
        }

        lensPass.uniforms.time.value = time;
        lensPass.uniforms.bhPower.value = THREE.MathUtils.lerp(0.0, 0.15, bhIntensity);
        lensPass.uniforms.warpPower.value = THREE.MathUtils.lerp(0.0, 0.25, warpIntensity);

        const exposure = THREE.MathUtils.lerp(1.2, 1.45, bhIntensity);
        renderer.toneMappingExposure = exposure;
        bloomPass.strength = THREE.MathUtils.lerp(1.35, 1.85, warpIntensity);
        bloomPass.radius = THREE.MathUtils.lerp(0.8, 0.95, bhIntensity);
        bloomPass.threshold = THREE.MathUtils.lerp(0.06, 0.03, bhIntensity);
      } else {
        if (!sequence.done) {
          sequence.done = true;
          controls.enabled = true;
          controls.autoRotate = true;
          controls.autoRotateSpeed = 0.18;
        }

        controls.target.set(0, 0, 0);
        controls.update();

        blackHole.group.rotation.y += delta * 0.12;
        blackHole.diskOuter.rotation.z += delta * 0.16;
        blackHole.diskInner.rotation.z -= delta * 0.22;
        blackHole.photonRing.rotation.z += delta * 0.08;

        blackHole.halo.material.uniforms.time.value = time;
        blackHole.outerGlow.material.uniforms.time.value = time;
        blackHole.photonRing.material.uniforms.time.value = time;
        blackHole.diskOuter.material.uniforms.time.value = time;
        blackHole.diskInner.material.uniforms.time.value = time;

        nebula.material.uniforms.time.value = time;
        nebula.points.rotation.y += delta * 0.01;

        stars.material.uniforms = stars.material.uniforms || {};
        if (stars.material.uniforms.time) stars.material.uniforms.time.value = time;
        stars.rotation.y = time * 0.01;

        updateDustRing(dustRing, delta, time);
        dustRing.points.rotation.y += delta * 0.05;

        updateWarpStreaks(warpStreaks, time, 0.08);
        warpStreaks.lines.rotation.y += delta * 0.04;

        galaxyA.group.rotation.y += delta * 0.015;
        galaxyA.galaxy.rotation.z += delta * 0.018;
        galaxyB.group.rotation.y -= delta * 0.012;
        galaxyB.galaxy.rotation.z -= delta * 0.022;

        dyson.group.rotation.y += delta * 0.05;
        dyson.group.rotation.x += delta * 0.02;
        dyson.star.scale.setScalar(1.0 + Math.sin(time * 2.0) * 0.01);
        dyson.shell.rotation.y -= delta * 0.02;

        horror.group.rotation.y += delta * 0.02;
        horror.aura.material.uniforms.time.value = time;

        lensPass.uniforms.time.value = time;
        lensPass.uniforms.bhPower.value = 0.04;
        lensPass.uniforms.warpPower.value = 0.06;
        renderer.toneMappingExposure = 1.18;
        bloomPass.strength = 1.38;
        bloomPass.radius = 0.8;
        bloomPass.threshold = 0.06;
      }

      composer.render();
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      bloomPass.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
