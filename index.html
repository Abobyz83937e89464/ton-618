<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cinematic Space Scene</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      overscroll-behavior: none;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    canvas { display: block; }
    #hud {
      position: fixed;
      left: 12px;
      top: 10px;
      z-index: 10;
      color: rgba(255,255,255,.75);
      font-size: 13px;
      text-shadow: 0 1px 2px rgba(0,0,0,.9);
      pointer-events: none;
      user-select: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="hud">Чёрная дыра / fly-in / wormhole / galaxy / nebula / Dyson sphere</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const TAU = Math.PI * 2;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000004);
    scene.fog = new THREE.FogExp2(0x000004, 0.0010);

    const camera = new THREE.PerspectiveCamera(56, window.innerWidth / window.innerHeight, 0.1, 8000);
    camera.position.set(0, 40, 1050);

    const renderer = new THREE.WebGLRenderer({
      antialias: false,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.domElement.style.touchAction = 'none';
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enabled = false;
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.08;
    controls.minDistance = 40;
    controls.maxDistance = 1200;
    controls.target.set(0, 0, 0);

    const world = new THREE.Group();
    world.rotation.set(-0.18, 0.25, -0.08);
    scene.add(world);

    const pointer = new THREE.Vector2(0, 0);
    window.addEventListener('pointermove', (e) => {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -((e.clientY / window.innerHeight) * 2 - 1);
    }, { passive: true });

    function clamp(v, a, b) {
      return Math.max(a, Math.min(b, v));
    }

    function smoothstep(edge0, edge1, x) {
      const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
      return t * t * (3 - 2 * t);
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function makeStarField(count = 6500) {
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const sizes = new Float32Array(count);
      const twinkle = new Float32Array(count);

      const c = new THREE.Color();

      for (let i = 0; i < count; i++) {
        const u = Math.random() * 2 - 1;
        const theta = Math.random() * TAU;
        const r = 900 + Math.pow(Math.random(), 0.4) * 3600;
        const s = Math.sqrt(1 - u * u);

        positions[i * 3 + 0] = r * s * Math.cos(theta);
        positions[i * 3 + 1] = r * u;
        positions[i * 3 + 2] = r * s * Math.sin(theta);

        const mix = Math.random();
        if (mix < 0.72) c.setHSL(0.58 + Math.random() * 0.08, 0.18 + Math.random() * 0.12, 0.76 + Math.random() * 0.18);
        else if (mix < 0.92) c.setHSL(0.08 + Math.random() * 0.06, 0.28 + Math.random() * 0.12, 0.84 + Math.random() * 0.1);
        else c.setHSL(0.0, 0.0, 1.0);

        colors[i * 3 + 0] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;

        sizes[i] = 0.8 + Math.random() * 2.2;
        twinkle[i] = 0.4 + Math.random() * 2.4;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
      geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
      geo.setAttribute('aTwinkle', new THREE.BufferAttribute(twinkle, 1));

      const mat = new THREE.ShaderMaterial({
        uniforms: { time: { value: 0 } },
        vertexShader: `
          attribute vec3 aColor;
          attribute float aSize;
          attribute float aTwinkle;
          uniform float time;
          varying vec3 vColor;

          void main() {
            vColor = aColor;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            float pulse = 0.72 + 0.28 * sin(time * aTwinkle + position.x * 0.002 + position.y * 0.0015);
            gl_PointSize = aSize * pulse * (230.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          precision highp float;
          varying vec3 vColor;

          void main() {
            vec2 p = gl_PointCoord - 0.5;
            float d = dot(p, p);
            float a = exp(-d * 12.0);
            if (a < 0.01) discard;
            gl_FragColor = vec4(vColor, a);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      const points = new THREE.Points(geo, mat);
      scene.add(points);
      return { points, material: mat };
    }

    function createSpiralGalaxy({
      count = 18000,
      size = 150,
      branches = 4,
      spin = 0.04,
      randomness = 0.45,
      centerColor = 0xffd7a6,
      edgeColor = 0x4a90ff,
      opacity = 0.78
    }) {
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);

      const c1 = new THREE.Color(centerColor);
      const c2 = new THREE.Color(edgeColor);
      const c = new THREE.Color();

      for (let i = 0; i < count; i++) {
        const radius = Math.pow(Math.random(), 0.52) * size;
        const branchAngle = ((i % branches) / branches) * TAU;
        const spinAngle = radius * spin;

        const randomX = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * randomness * radius;
        const randomY = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * randomness * radius * 0.3;
        const randomZ = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * randomness * radius;

        positions[i * 3 + 0] = Math.cos(branchAngle + spinAngle) * radius + randomX;
        positions[i * 3 + 1] = randomY;
        positions[i * 3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

        c.copy(c1).lerp(c2, radius / size);
        colors[i * 3 + 0] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const mat = new THREE.PointsMaterial({
        size: 0.85,
        vertexColors: true,
        transparent: true,
        opacity,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        sizeAttenuation: true
      });

      const points = new THREE.Points(geo, mat);
      return points;
    }

    function createDustRing({
      count = 3200,
      inner = 18,
      outer = 180,
      height = 22,
      size = 0.72,
      opacity = 0.52,
      warm = 0xffb45f,
      cool = 0x5d9cff,
      speedMul = 1.0
    }) {
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);

      const radii = new Float32Array(count);
      const angles = new Float32Array(count);
      const speeds = new Float32Array(count);
      const yOffsets = new Float32Array(count);

      const warmC = new THREE.Color(warm);
      const coolC = new THREE.Color(cool);
      const c = new THREE.Color();

      for (let i = 0; i < count; i++) {
        const t = Math.pow(Math.random(), 0.62);
        radii[i] = inner + (outer - inner) * t;
        angles[i] = Math.random() * TAU;
        speeds[i] = (0.18 + Math.random() * 1.25) * speedMul;
        yOffsets[i] = (Math.random() - 0.5) * height;

        c.copy(warmC).lerp(coolC, Math.random());
        colors[i * 3 + 0] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const mat = new THREE.PointsMaterial({
        size,
        vertexColors: true,
        transparent: true,
        opacity,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        sizeAttenuation: true
      });

      const points = new THREE.Points(geo, mat);
      return { points, geo, positions, radii, angles, speeds, yOffsets };
    }

    function updateDustRing(dust, delta, time) {
      const pos = dust.positions;
      const count = dust.radii.length;

      for (let i = 0; i < count; i++) {
        const r = dust.radii[i];
        dust.angles[i] += delta * dust.speeds[i] * (0.22 + 10.0 / (r + 18.0));

        const wobble = Math.sin(time * 0.8 + i * 0.017) * 0.7;
        pos[i * 3 + 0] = Math.cos(dust.angles[i]) * r;
        pos[i * 3 + 1] = dust.yOffsets[i] * 0.55 + wobble;
        pos[i * 3 + 2] = Math.sin(dust.angles[i]) * r;
      }

      dust.geo.attributes.position.needsUpdate = true;
    }

    function createSoftCloud({
      count = 1200,
      radius = 220,
      thickness = 110,
      colorA = 0x7ab8ff,
      colorB = 0xff8a4a,
      sizeMin = 28,
      sizeMax = 70,
      opacity = 0.22
    }) {
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const sizes = new Float32Array(count);
      const alphas = new Float32Array(count);

      const c1 = new THREE.Color(colorA);
      const c2 = new THREE.Color(colorB);
      const c = new THREE.Color();

      for (let i = 0; i < count; i++) {
        const u = Math.random() * TAU;
        const v = Math.acos(THREE.MathUtils.randFloatSpread(2));
        const rr = Math.pow(Math.random(), 0.55) * radius;

        positions[i * 3 + 0] = Math.cos(u) * Math.sin(v) * rr + (Math.random() - 0.5) * 24;
        positions[i * 3 + 1] = (Math.random() - 0.5) * thickness;
        positions[i * 3 + 2] = Math.sin(u) * Math.sin(v) * rr + (Math.random() - 0.5) * 24;

        c.copy(c1).lerp(c2, Math.random());
        colors[i * 3 + 0] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;

        sizes[i] = sizeMin + Math.random() * (sizeMax - sizeMin);
        alphas[i] = opacity * (0.4 + Math.random() * 0.9);
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
      geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
      geo.setAttribute('aAlpha', new THREE.BufferAttribute(alphas, 1));

      const mat = new THREE.ShaderMaterial({
        uniforms: { time: { value: 0 } },
        vertexShader: `
          attribute vec3 aColor;
          attribute float aSize;
          attribute float aAlpha;
          uniform float time;
          varying vec3 vColor;
          varying float vAlpha;

          void main() {
            vColor = aColor;
            vAlpha = aAlpha;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            float pulse = 0.72 + 0.28 * sin(time * 0.25 + position.x * 0.002 + position.z * 0.0015);
            gl_PointSize = aSize * pulse * (250.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          precision highp float;
          varying vec3 vColor;
          varying float vAlpha;

          void main() {
            vec2 p = gl_PointCoord - 0.5;
            float d = dot(p, p);
            float a = exp(-d * 7.0) * vAlpha;
            if (a < 0.004) discard;
            gl_FragColor = vec4(vColor, a);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      const points = new THREE.Points(geo, mat);
      return points;
    }

    function createBlackHole() {
      const group = new THREE.Group();
      world.add(group);

      const core = new THREE.Mesh(
        new THREE.SphereGeometry(28, 72, 72),
        new THREE.MeshBasicMaterial({ color: 0x000000 })
      );
      group.add(core);

      const innerVoid = new THREE.Mesh(
        new THREE.SphereGeometry(36, 72, 72),
        new THREE.MeshBasicMaterial({
          color: 0x000000,
          transparent: true,
          opacity: 0.15
        })
      );
      group.add(innerVoid);

      const glow = new THREE.Mesh(
        new THREE.SphereGeometry(38, 72, 72),
        new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          side: THREE.BackSide,
          blending: THREE.AdditiveBlending,
          uniforms: {
            time: { value: 0 },
            colorA: { value: new THREE.Color(0x73baff) },
            colorB: { value: new THREE.Color(0xff9a50) }
          },
          vertexShader: `
            varying vec3 vNormalW;
            varying vec3 vPosW;
            void main() {
              vNormalW = normalize(normalMatrix * normal);
              vec4 worldPos = modelMatrix * vec4(position, 1.0);
              vPosW = worldPos.xyz;
              gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
          `,
          fragmentShader: `
            precision highp float;
            uniform float time;
            uniform vec3 colorA;
            uniform vec3 colorB;
            varying vec3 vNormalW;
            varying vec3 vPosW;

            void main() {
              vec3 viewDir = normalize(cameraPosition - vPosW);
              float fresnel = pow(1.0 - max(dot(normalize(vNormalW), viewDir), 0.0), 3.5);
              float pulse = 0.6 + 0.4 * sin(time * 1.1 + vPosW.y * 0.08);
              vec3 col = mix(colorA, colorB, 0.45 + 0.5 * sin(time * 0.55));
              col *= fresnel * (0.15 + pulse * 0.7);
              gl_FragColor = vec4(col, fresnel * 0.8);
            }
          `
        })
      );
      group.add(glow);

      const ring1 = new THREE.Mesh(
        new THREE.TorusGeometry(42, 2.2, 18, 280),
        new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide,
          blending: THREE.AdditiveBlending,
          uniforms: {
            time: { value: 0 },
            warmColor: { value: new THREE.Color(0xffcf8a) },
            coolColor: { value: new THREE.Color(0x5d9cff) }
          },
          vertexShader: `
            varying vec2 vUv;
            varying vec3 vPos;
            void main() {
              vUv = uv;
              vPos = position;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            precision highp float;
            varying vec2 vUv;
            varying vec3 vPos;
            uniform float time;
            uniform vec3 warmColor;
            uniform vec3 coolColor;

            float hash(vec2 p) {
              return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
            }

            void main() {
              float band = 0.5 + 0.5 * sin(vUv.x * 90.0 + time * 4.0 + vPos.y * 6.0);
              float band2 = 0.5 + 0.5 * sin(vUv.y * 18.0 - time * 2.6);
              float n = hash(vUv * 130.0 + time * 0.03);
              vec3 col = mix(warmColor, coolColor, 0.32 + 0.4 * band);
              col += vec3(1.0, 0.7, 0.28) * n * 0.14;
              float a = (0.55 + 0.45 * band) * (0.58 + 0.42 * band2);
              gl_FragColor = vec4(col, a * 0.95);
            }
          `
        })
      );
      ring1.rotation.x = Math.PI / 2.25;
      ring1.rotation.z = 0.28;
      group.add(ring1);

      const diskOuter = new THREE.Mesh(
        new THREE.RingGeometry(40, 140, 256, 1),
        new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide,
          blending: THREE.AdditiveBlending,
          uniforms: {
            time: { value: 0 },
            warmColor: { value: new THREE.Color(0xffb25a) },
            coolColor: { value: new THREE.Color(0x5d9cff) }
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            precision highp float;
            varying vec2 vUv;
            uniform float time;
            uniform vec3 warmColor;
            uniform vec3 coolColor;

            float hash(vec2 p) {
              return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
            }

            float noise(vec2 p) {
              vec2 i = floor(p);
              vec2 f = fract(p);
              float a = hash(i);
              float b = hash(i + vec2(1.0, 0.0));
              float c = hash(i + vec2(0.0, 1.0));
              float d = hash(i + vec2(1.0, 1.0));
              vec2 u = f * f * (3.0 - 2.0 * f);
              return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
            }

            void main() {
              vec2 p = vUv * 2.0 - 1.0;
              p.x *= 1.1;
              float r = length(p);
              if (r < 0.28 || r > 1.0) discard;

              float a = atan(p.y, p.x);
              float n = noise(p * 7.0 + vec2(time * 0.12, -time * 0.08));
              a += time * 0.38 / (r + 0.09);

              float spiral = sin(r * 40.0 - time * 4.0 + a * 12.0 + n * 5.0);
              float spiral2 = sin(r * 11.0 + time * 2.4 - a * 7.0);
              float bands = max(0.0, (0.52 + 0.48 * spiral) * (0.72 + 0.28 * spiral2));

              float innerGlow = exp(-pow((r - 0.3) / 0.07, 2.0));
              float outerGlow = exp(-pow((r - 0.95) / 0.12, 2.0));

              vec3 col = mix(warmColor, coolColor, smoothstep(0.25, 1.0, r));
              col += warmColor * pow(bands, 3.0) * 1.4;
              col += vec3(1.0, 0.76, 0.35) * innerGlow * 2.0;
              col += vec3(0.18, 0.4, 1.0) * outerGlow * 0.8;
              col *= 1.0 + n * 0.18;

              float alpha = smoothstep(1.0, 0.22, r) * bands;
              gl_FragColor = vec4(col, alpha);
            }
          `
        })
      );
      diskOuter.rotation.x = -Math.PI / 2;
      diskOuter.rotation.z = 0.18;
      group.add(diskOuter);

      const diskInner = new THREE.Mesh(
        new THREE.RingGeometry(30, 90, 256, 1),
        new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide,
          blending: THREE.AdditiveBlending,
          uniforms: {
            time: { value: 0 },
            warmColor: { value: new THREE.Color(0xffdfb0) },
            coolColor: { value: new THREE.Color(0x8abaff) }
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            precision highp float;
            varying vec2 vUv;
            uniform float time;
            uniform vec3 warmColor;
            uniform vec3 coolColor;

            float hash(vec2 p) {
              return fract(sin(dot(p, vec2(13.7, 91.4))) * 43758.5453);
            }

            float noise(vec2 p) {
              vec2 i = floor(p);
              vec2 f = fract(p);
              float a = hash(i);
              float b = hash(i + vec2(1.0, 0.0));
              float c = hash(i + vec2(0.0, 1.0));
              float d = hash(i + vec2(1.0, 1.0));
              vec2 u = f * f * (3.0 - 2.0 * f);
              return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
            }

            void main() {
              vec2 p = vUv * 2.0 - 1.0;
              p.x *= 1.08;
              float r = length(p);
              if (r < 0.3 || r > 1.0) discard;

              float a = atan(p.y, p.x);
              float n = noise(p * 10.0 + vec2(time * 0.18, time * 0.06));
              a += time * 0.64 / (r + 0.08);

              float spiral = sin(r * 52.0 - time * 5.5 + a * 14.0 + n * 5.0);
              float bands = max(0.0, 0.48 + 0.52 * spiral);

              float coreGlow = exp(-pow((r - 0.34) / 0.05, 2.0));
              float rimGlow = exp(-pow((r - 0.96) / 0.12, 2.0));

              vec3 col = mix(warmColor, coolColor, smoothstep(0.08, 1.0, r));
              col += warmColor * pow(bands, 3.2) * 1.7;
              col += vec3(1.0, 0.8, 0.4) * coreGlow * 2.1;
              col += vec3(0.25, 0.45, 1.0) * rimGlow * 0.55;

              float alpha = smoothstep(1.0, 0.2, r) * bands;
              gl_FragColor = vec4(col, alpha);
            }
          `
        })
      );
      diskInner.rotation.x = -Math.PI / 2;
      diskInner.rotation.z = -0.22;
      diskInner.position.y = 0.25;
      group.add(diskInner);

      const pointLight = new THREE.PointLight(0xff9c52, 5.0, 500, 2);
      group.add(pointLight);

      return { group, core, innerVoid, glow, ring1, diskOuter, diskInner, pointLight };
    }

    function createWormhole() {
      const group = new THREE.Group();
      group.position.set(0, 0, 540);
      world.add(group);

      const geo = new THREE.CylinderGeometry(150, 150, 980, 120, 1, true);
      const mat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending,
        uniforms: { time: { value: 0 } },
        vertexShader: `
          varying vec2 vUv;
          varying vec3 vPos;
          void main() {
            vUv = uv;
            vPos = position;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          precision highp float;
          varying vec2 vUv;
          varying vec3 vPos;
          uniform float time;

          float hash(vec2 p) {
            return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
          }

          void main() {
            vec2 p = vUv * 2.0 - 1.0;
            p.x *= 1.35;

            float r = length(p);
            float tunnel = smoothstep(1.0, 0.05, r);
            float a = atan(p.y, p.x);

            float swirl = sin(a * 16.0 + time * 4.8 + r * 14.0);
            float bands = 0.5 + 0.5 * sin(vUv.y * 42.0 - time * 6.0 + swirl * 1.4);
            float bands2 = 0.5 + 0.5 * sin(r * 30.0 - time * 3.2 + a * 8.0);

            float speck = hash(vUv * 160.0 + time * 0.02);
            float stars = smoothstep(0.985, 1.0, speck) * 0.85;

            vec3 c1 = vec3(0.11, 0.24, 1.0);
            vec3 c2 = vec3(1.0, 0.53, 0.18);
            vec3 col = mix(c1, c2, 0.5 + 0.5 * swirl);
            col += vec3(1.0, 0.72, 0.3) * pow(bands, 3.0) * 0.75;
            col += vec3(0.65, 0.88, 1.0) * stars * 0.9;
            col *= tunnel * (0.55 + 0.45 * bands2);

            float alpha = tunnel * (0.35 + 0.65 * bands2);
            gl_FragColor = vec4(col, alpha * 0.7);
          }
        `
      });

      const tunnel = new THREE.Mesh(geo, mat);
      tunnel.rotation.x = Math.PI / 2;
      tunnel.rotation.z = 0.22;
      group.add(tunnel);

      const halo = new THREE.Mesh(
        new THREE.TorusGeometry(152, 8, 20, 180),
        new THREE.MeshBasicMaterial({
          color: 0x67b6ff,
          transparent: true,
          opacity: 0.18,
          blending: THREE.AdditiveBlending
        })
      );
      halo.rotation.x = Math.PI / 2.15;
      halo.rotation.z = 0.18;
      group.add(halo);

      return { group, tunnel, halo };
    }

    function createSoftCloud({
      count = 1200,
      radius = 220,
      thickness = 110,
      colorA = 0x7ab8ff,
      colorB = 0xff8a4a,
      sizeMin = 28,
      sizeMax = 70,
      opacity = 0.2,
      position = new THREE.Vector3(),
      scale = 1
    }) {
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const sizes = new Float32Array(count);
      const alphas = new Float32Array(count);

      const c1 = new THREE.Color(colorA);
      const c2 = new THREE.Color(colorB);
      const c = new THREE.Color();

      for (let i = 0; i < count; i++) {
        const a = Math.random() * TAU;
        const b = Math.acos(THREE.MathUtils.randFloat(-1, 1));
        const rr = Math.pow(Math.random(), 0.55) * radius;

        positions[i * 3 + 0] = Math.cos(a) * Math.sin(b) * rr + (Math.random() - 0.5) * 30;
        positions[i * 3 + 1] = (Math.random() - 0.5) * thickness;
        positions[i * 3 + 2] = Math.sin(a) * Math.sin(b) * rr + (Math.random() - 0.5) * 30;

        c.copy(c1).lerp(c2, Math.random());
        colors[i * 3 + 0] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;

        sizes[i] = sizeMin + Math.random() * (sizeMax - sizeMin);
        alphas[i] = opacity * (0.4 + Math.random() * 0.9);
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
      geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
      geo.setAttribute('aAlpha', new THREE.BufferAttribute(alphas, 1));

      const mat = new THREE.ShaderMaterial({
        uniforms: { time: { value: 0 } },
        vertexShader: `
          attribute vec3 aColor;
          attribute float aSize;
          attribute float aAlpha;
          uniform float time;
          varying vec3 vColor;
          varying float vAlpha;

          void main() {
            vColor = aColor;
            vAlpha = aAlpha;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            float pulse = 0.72 + 0.28 * sin(time * 0.25 + position.x * 0.002 + position.z * 0.0015);
            gl_PointSize = aSize * pulse * (250.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          precision highp float;
          varying vec3 vColor;
          varying float vAlpha;

          void main() {
            vec2 p = gl_PointCoord - 0.5;
            float d = dot(p, p);
            float a = exp(-d * 7.0) * vAlpha;
            if (a < 0.004) discard;
            gl_FragColor = vec4(vColor, a);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      const points = new THREE.Points(geo, mat);
      points.position.copy(position);
      points.scale.setScalar(scale);
      return points;
    }

    function createWarpStreaks(count = 900) {
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 2 * 3);
      const colors = new Float32Array(count * 2 * 3);

      const dirs = [];
      const speeds = [];
      const phases = [];
      const lengths = [];

      const c1 = new THREE.Color(0x9dcfff);
      const c2 = new THREE.Color(0xffffff);

      for (let i = 0; i < count; i++) {
        const dir = new THREE.Vector3(
          (Math.random() - 0.5) * 2,
          (Math.random() - 0.5) * 2,
          (Math.random() - 0.5) * 2
        ).normalize();

        dirs.push(dir);
        speeds.push(0.3 + Math.random() * 1.7);
        phases.push(Math.random());
        lengths.push(18 + Math.random() * 92);

        const col = c1.clone().lerp(c2, Math.random());
        colors[i * 6 + 0] = col.r;
        colors[i * 6 + 1] = col.g;
        colors[i * 6 + 2] = col.b;
        colors[i * 6 + 3] = col.r;
        colors[i * 6 + 4] = col.g;
        colors[i * 6 + 5] = col.b;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const mat = new THREE.LineBasicMaterial({
        vertexColors: true,
        transparent: true,
        opacity: 0.0,
        blending: THREE.AdditiveBlending
      });

      const lines = new THREE.LineSegments(geo, mat);
      scene.add(lines);

      return { lines, geo, positions, dirs, speeds, phases, lengths };
    }

    function updateWarpStreaks(warp, time, introMix) {
      const pos = warp.positions;
      const stretch = 1.0 + introMix * 2.5;

      for (let i = 0; i < warp.dirs.length; i++) {
        const dir = warp.dirs[i];
        const t = (time * warp.speeds[i] * 0.9 + warp.phases[i]) % 1.0;
        const base = 22 + t * 420;
        const len = warp.lengths[i] * stretch;

        const start = dir.clone().multiplyScalar(base);
        const end = dir.clone().multiplyScalar(base + len);

        const o = i * 6;
        pos[o + 0] = start.x;
        pos[o + 1] = start.y;
        pos[o + 2] = start.z;
        pos[o + 3] = end.x;
        pos[o + 4] = end.y;
        pos[o + 5] = end.z;
      }

      warp.geo.attributes.position.needsUpdate = true;
      warp.lines.material.opacity = 0.02 + introMix * 0.28;
    }

    composer.addPass(bloomPass);

    const lensPass = new ShaderPass({
      uniforms: {
        tDiffuse: { value: null },
        time: { value: 0 },
        strength: { value: 0.03 },
        swirl: { value: 0.06 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        precision highp float;
        uniform sampler2D tDiffuse;
        uniform float time;
        uniform float strength;
        uniform float swirl;
        varying vec2 vUv;

        void main() {
          vec2 uv = vUv;
          vec2 c = vec2(0.5, 0.5);
          vec2 p = uv - c;
          float r = length(p);
          float a = atan(p.y, p.x);

          float lens = strength / (r * r + 0.05);
          float twist = swirl / (r + 0.05);

          a += twist * 0.06;
          vec2 dir = vec2(cos(a), sin(a));
          vec2 warped = c + dir * (r * (1.0 + lens));

          vec3 col;
          col.r = texture2D(tDiffuse, warped + p * 0.0022).r;
          col.g = texture2D(tDiffuse, warped).g;
          col.b = texture2D(tDiffuse, warped - p * 0.0022).b;

          float vignette = smoothstep(1.08, 0.18, r);
          col *= vignette;

          float grain = fract(sin(dot(gl_FragCoord.xy + time * 60.0, vec2(12.9898, 78.233))) * 43758.5453) - 0.5;
          col += grain * 0.008;

          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    composer.addPass(lensPass);

    const clock = new THREE.Clock();
    const introSeconds = 12.0;

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.elapsedTime;

      const introT = clamp(time / introSeconds, 0, 1);
      const introMix = 1.0 - easeInOutCubic(introT);
      const blackHoleFocus = smoothstep(420, 65, camera.position.length());

      if (introT < 1.0) {
        controls.enabled = false;

        const p = cameraPath.getPointAt(easeInOutCubic(introT));
        const look = cameraPath.getPointAt(clamp(easeInOutCubic(introT) + 0.012, 0, 1));

        const shake = introMix * 4.0 + blackHoleFocus * 2.0;
        camera.position.copy(p);
        camera.position.x += Math.sin(time * 22.0) * 0.18 * shake;
        camera.position.y += Math.cos(time * 19.0) * 0.14 * shake;
        camera.position.z += Math.sin(time * 17.0) * 0.12 * shake;
        camera.lookAt(look);
      } else {
        controls.enabled = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.08;
        controls.target.set(0, 0, 0);
        controls.update();
      }

      // мягкое общее движение
      world.rotation.y = 0.24 + Math.sin(time * 0.08) * 0.03 + pointer.x * 0.03;
      world.rotation.x = -0.18 + Math.sin(time * 0.06) * 0.02 + pointer.y * 0.025;

      // центральная дыра
      blackHole.core.scale.setScalar(1.0 + Math.sin(time * 2.2) * 0.012);
      blackHole.innerVoid.scale.setScalar(1.0 + Math.sin(time * 1.4) * 0.01);
      blackHole.glow.material.uniforms.time.value = time;
      blackHole.ring1.material.uniforms.time.value = time;
      blackHole.diskOuter.material.uniforms.time.value = time;
      blackHole.diskInner.material.uniforms.time.value = time;
      blackHole.pointLight.intensity = 4.5 + blackHoleFocus * 1.6 + Math.sin(time * 2.0) * 0.25;

      blackHole.group.rotation.z += delta * 0.12;
      blackHole.ring1.rotation.z += delta * 0.11;
      blackHole.diskOuter.rotation.z += delta * 0.17;
      blackHole.diskInner.rotation.z -= delta * 0.23;

      // wormhole
      wormhole.group.rotation.z += delta * 0.05;
      wormhole.group.rotation.x += delta * 0.012;
      wormhole.tunnel.material.uniforms.time.value = time;
      wormhole.halo.rotation.z += delta * 0.08;

      // galaxies
      galaxyA.rotation.z += delta * 0.02;
      galaxyA.rotation.y += delta * 0.018;
      galaxyB.rotation.z -= delta * 0.022;
      galaxyB.rotation.y -= delta * 0.015;

      // dyson sphere
      dyson.group.rotation.y += delta * 0.12;
      dyson.group.rotation.x += delta * 0.05;
      dyson.star.scale.setScalar(1.0 + Math.sin(time * 3.0) * 0.02);
      dyson.light.intensity = 6.8 + Math.sin(time * 1.6) * 0.7;
      dyson.shell.rotation.y -= delta * 0.05;
      dyson.ring1.rotation.z += delta * 0.08;
      dyson.ring2.rotation.z -= delta * 0.06;

      // horror
      horror.group.rotation.y += delta * 0.06;
      horror.group.rotation.x += delta * 0.03;
      horror.eye1.intensity = 1.25 + Math.sin(time * 3.0) * 0.4;
      horror.eye2.intensity = 1.25 + Math.cos(time * 2.7) * 0.4;
      horror.aura.material.uniforms.time.value = time;

      // clouds / nebula
      cloud1.material.uniforms.time.value = time;
      cloud2.material.uniforms.time.value = time;
      cloud3.material.uniforms.time.value = time;
      cloud1.rotation.y += delta * 0.01;
      cloud2.rotation.y -= delta * 0.008;
      cloud3.rotation.y += delta * 0.006;

      // dust
      updateDustRing(dustInner, delta, time);
      updateDustRing(dustOuter, delta, time * 0.7);
      dustInner.points.rotation.y += delta * 0.07;
      dustOuter.points.rotation.y -= delta * 0.04;

      // warp streaks for fly-in
      updateWarpStreaks(warp, time, introMix);

      // debris
      for (const d of debris.items) {
        d.mesh.rotateOnAxis(d.axis, delta * d.speed * 0.5);
        d.mesh.position.x += Math.sin(time * 0.25 + d.phase) * 0.01;
        d.mesh.position.y += Math.cos(time * 0.18 + d.phase) * 0.01;
        d.mesh.position.z += Math.sin(time * 0.21 + d.phase) * 0.01;
      }

      stars.material.uniforms.time.value = time;
      stars.rotation.y = time * 0.015;
      stars.rotation.x = Math.sin(time * 0.03) * 0.01;

      // киношный пост
      const focus = blackHoleFocus;
      lensPass.uniforms.time.value = time;
      lensPass.uniforms.strength.value = 0.025 + focus * 0.085 + introMix * 0.02;
      lensPass.uniforms.swirl.value = 0.05 + focus * 0.12;
      bloomPass.strength = 1.0 + focus * 0.85 + introMix * 0.35;
      bloomPass.radius = 0.78;
      bloomPass.threshold = 0.06;
      renderer.toneMappingExposure = 1.1 + focus * 0.1;

      composer.render();
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      bloomPass.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
