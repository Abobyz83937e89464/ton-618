<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D Black Hole</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      overscroll-behavior: none;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    canvas { display: block; }
    #hud {
      position: fixed;
      left: 12px;
      top: 10px;
      z-index: 10;
      color: rgba(255,255,255,.72);
      font-size: 13px;
      text-shadow: 0 1px 2px rgba(0,0,0,.9);
      pointer-events: none;
      user-select: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="hud">Чёрная дыра | тач/мышь — вращение, колесо — зум</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000008);
    scene.fog = new THREE.FogExp2(0x000008, 0.00075);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 6000);
    camera.position.set(0, 58, 230);

    const renderer = new THREE.WebGLRenderer({
      antialias: false,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.22;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.22;
    controls.minDistance = 40;
    controls.maxDistance = 620;
    controls.target.set(0, 0, 0);

    const root = new THREE.Group();
    root.rotation.set(-0.28, 0.32, -0.12);
    scene.add(root);

    const pointer = new THREE.Vector2(0, 0);
    window.addEventListener('pointermove', (e) => {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -((e.clientY / window.innerHeight) * 2 - 1);
    }, { passive: true });

    const ambient = new THREE.AmbientLight(0x223355, 0.45);
    scene.add(ambient);

    const warmLight = new THREE.PointLight(0xffa45a, 4.5, 900, 2);
    warmLight.position.set(35, 15, 80);
    scene.add(warmLight);

    const coolLight = new THREE.PointLight(0x6aa8ff, 3.0, 900, 2);
    coolLight.position.set(-120, -40, -100);
    scene.add(coolLight);

    function makeStarField(count = 8000) {
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const sizes = new Float32Array(count);
      const flicker = new Float32Array(count);

      const c = new THREE.Color();

      for (let i = 0; i < count; i++) {
        const u = Math.random() * 2 - 1;
        const theta = Math.random() * Math.PI * 2;
        const r = 1000 + Math.pow(Math.random(), 0.42) * 3200;
        const s = Math.sqrt(1 - u * u);

        positions[i * 3 + 0] = r * s * Math.cos(theta);
        positions[i * 3 + 1] = r * u;
        positions[i * 3 + 2] = r * s * Math.sin(theta);

        const mix = Math.random();
        if (mix < 0.72) c.setHSL(0.58 + Math.random() * 0.08, 0.18 + Math.random() * 0.15, 0.78 + Math.random() * 0.18);
        else if (mix < 0.92) c.setHSL(0.09 + Math.random() * 0.05, 0.32 + Math.random() * 0.12, 0.82 + Math.random() * 0.12);
        else c.setHSL(0.0, 0.0, 1.0);

        colors[i * 3 + 0] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;

        sizes[i] = 0.8 + Math.random() * 2.8;
        flicker[i] = 0.4 + Math.random() * 2.8;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
      geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
      geo.setAttribute('aFlicker', new THREE.BufferAttribute(flicker, 1));

      const mat = new THREE.ShaderMaterial({
        uniforms: {
          time: { value: 0 }
        },
        vertexShader: `
          attribute vec3 aColor;
          attribute float aSize;
          attribute float aFlicker;
          uniform float time;
          varying vec3 vColor;
          void main() {
            vColor = aColor;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            float pulse = 0.72 + 0.28 * sin(time * aFlicker + position.x * 0.002 + position.y * 0.0015);
            gl_PointSize = aSize * pulse * (220.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          precision highp float;
          varying vec3 vColor;
          void main() {
            vec2 p = gl_PointCoord - 0.5;
            float d = length(p);
            float a = smoothstep(0.5, 0.0, d);
            if (a < 0.01) discard;
            gl_FragColor = vec4(vColor, a);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      const points = new THREE.Points(geo, mat);
      scene.add(points);

      return { points, material: mat };
    }

    function makeOrbitDust(count, innerRadius, outerRadius, height, baseSize, warm, cool, speedMul) {
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const radii = new Float32Array(count);
      const angles = new Float32Array(count);
      const speeds = new Float32Array(count);
      const yOffsets = new Float32Array(count);

      const c = new THREE.Color();

      for (let i = 0; i < count; i++) {
        const t = Math.pow(Math.random(), 0.58);
        radii[i] = innerRadius + (outerRadius - innerRadius) * t;
        angles[i] = Math.random() * Math.PI * 2;
        speeds[i] = (0.18 + Math.random() * 1.3) * speedMul;
        yOffsets[i] = (Math.random() - 0.5) * height;

        const mix = Math.random();
        c.copy(warm).lerp(cool, mix);
        colors[i * 3 + 0] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const mat = new THREE.PointsMaterial({
        size: baseSize,
        vertexColors: true,
        transparent: true,
        opacity: 0.62,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      const points = new THREE.Points(geo, mat);
      root.add(points);

      return { points, geo, positions, radii, angles, speeds, yOffsets };
    }

    function makeDiskGlow(scale, inner, outer, speed, opacity, seed, warmColor, coolColor) {
      const geo = new THREE.PlaneGeometry(2, 2, 1, 1);

      const mat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        depthTest: true,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        uniforms: {
          time: { value: 0 },
          innerRadius: { value: inner },
          outerRadius: { value: outer },
          speed: { value: speed },
          opacityStrength: { value: opacity },
          seed: { value: seed },
          warmColor: { value: warmColor.clone() },
          coolColor: { value: coolColor.clone() }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          precision highp float;
          varying vec2 vUv;

          uniform float time;
          uniform float innerRadius;
          uniform float outerRadius;
          uniform float speed;
          uniform float opacityStrength;
          uniform float seed;
          uniform vec3 warmColor;
          uniform vec3 coolColor;

          float hash(vec2 p) {
            return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
          }

          float noise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            float a = hash(i);
            float b = hash(i + vec2(1.0, 0.0));
            float c = hash(i + vec2(0.0, 1.0));
            float d = hash(i + vec2(1.0, 1.0));
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
          }

          void main() {
            vec2 p = vUv * 2.0 - 1.0;
            p.x *= 1.1;

            float r = length(p);
            if (r < innerRadius || r > outerRadius) discard;

            float a = atan(p.y, p.x);
            float n = noise(p * 8.0 + vec2(time * 0.12, -time * 0.08) + seed * 7.0);

            a += time * speed * (0.55 / (r + 0.08));
            float spiral = sin(r * 38.0 - time * speed * 4.0 + a * 12.0 + n * 5.0);
            float spiral2 = sin(r * 11.0 + time * speed * 2.0 - a * 7.0 + seed * 13.0);

            float streaks = (0.55 + 0.45 * spiral) * (0.7 + 0.3 * spiral2);
            streaks = max(0.0, streaks);

            float innerGlow = exp(-pow((r - innerRadius) / 0.045, 2.0));
            float outerGlow = exp(-pow((r - outerRadius) / 0.13, 2.0));

            float alpha = smoothstep(outerRadius, outerRadius - 0.11, r);
            alpha *= smoothstep(innerRadius, innerRadius + 0.04, r);
            alpha *= opacityStrength;

            float heat = smoothstep(innerRadius, outerRadius, r);
            vec3 col = mix(warmColor, coolColor, heat);
            col += warmColor * pow(streaks, 3.0) * 1.4;
            col += vec3(1.0, 0.72, 0.35) * innerGlow * 2.0;
            col += vec3(0.18, 0.35, 1.0) * outerGlow * 0.7;
            col *= 1.0 + n * 0.18;

            gl_FragColor = vec4(col, alpha);
          }
        `
      });

      const mesh = new THREE.Mesh(geo, mat);
      mesh.scale.set(scale, scale, 1);
      mesh.rotation.x = -Math.PI / 2;
      root.add(mesh);
      return mesh;
    }

    function makeBlackCore(radius) {
      const geo = new THREE.SphereGeometry(radius, 72, 72);
      const mat = new THREE.MeshBasicMaterial({ color: 0x000000 });
      const mesh = new THREE.Mesh(geo, mat);
      root.add(mesh);
      return mesh;
    }

    function makeGlowSphere(radius, color, opacity, power) {
      const geo = new THREE.SphereGeometry(radius, 64, 64);
      const mat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending,
        uniforms: {
          time: { value: 0 },
          glowColor: { value: new THREE.Color(color) },
          opacityStrength: { value: opacity },
          powerStrength: { value: power }
        },
        vertexShader: `
          varying vec3 vNormalW;
          varying vec3 vPosW;
          void main() {
            vNormalW = normalize(normalMatrix * normal);
            vec4 worldPos = modelMatrix * vec4(position, 1.0);
            vPosW = worldPos.xyz;
            gl_Position = projectionMatrix * viewMatrix * worldPos;
          }
        `,
        fragmentShader: `
          precision highp float;
          uniform vec3 glowColor;
          uniform float opacityStrength;
          uniform float powerStrength;
          varying vec3 vNormalW;
          varying vec3 vPosW;

          void main() {
            vec3 viewDir = normalize(cameraPosition - vPosW);
            float fresnel = pow(1.0 - max(dot(normalize(vNormalW), viewDir), 0.0), powerStrength);
            vec3 col = glowColor * fresnel;
            gl_FragColor = vec4(col, fresnel * opacityStrength);
          }
        `
      });
      const mesh = new THREE.Mesh(geo, mat);
      root.add(mesh);
      return mesh;
    }

    function makeJets() {
      const group = new THREE.Group();

      const geo = new THREE.ConeGeometry(4.0, 140, 32, 1, true);
      const mat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        uniforms: {
          time: { value: 0 },
          colorA: { value: new THREE.Color(0x67b9ff) },
          colorB: { value: new THREE.Color(0xffa25a) }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          precision highp float;
          varying vec2 vUv;
          uniform float time;
          uniform vec3 colorA;
          uniform vec3 colorB;

          void main() {
            float body = 1.0 - abs(vUv.y - 0.5) * 2.0;
            float pulse = 0.65 + 0.35 * sin(time * 2.2 + vUv.y * 12.0);
            vec3 col = mix(colorA, colorB, 0.35 + 0.35 * sin(time * 0.8));
            float a = pow(max(body, 0.0), 2.4) * 0.15 * pulse;
            gl_FragColor = vec4(col, a);
          }
        `
      });

      const top = new THREE.Mesh(geo, mat);
      top.position.y = 78;
      top.rotation.x = Math.PI;
      const bottom = new THREE.Mesh(geo, mat);
      bottom.position.y = -78;

      group.add(top, bottom);
      root.add(group);
      return group;
    }

    function makePhotonRing() {
      const geo = new THREE.TorusGeometry(15.5, 1.45, 16, 220);
      const mat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        uniforms: {
          time: { value: 0 },
          colorA: { value: new THREE.Color(0xffc56d) },
          colorB: { value: new THREE.Color(0xff8a2d) }
        },
        vertexShader: `
          varying vec2 vUv;
          varying vec3 vPos;
          void main() {
            vUv = uv;
            vPos = position;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          precision highp float;
          varying vec2 vUv;
          varying vec3 vPos;
          uniform float time;
          uniform vec3 colorA;
          uniform vec3 colorB;

          float hash(vec2 p) {
            return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
          }

          void main() {
            float band = 0.5 + 0.5 * sin(vUv.x * 70.0 + time * 4.0 + vPos.y * 4.0);
            float noise = hash(vUv * 70.0 + time * 0.03);
            vec3 col = mix(colorA, colorB, 0.35 + 0.35 * band);
            col += vec3(1.0, 0.65, 0.2) * noise * 0.12;
            float alpha = 0.55 + 0.45 * band;
            gl_FragColor = vec4(col, alpha * 0.95);
          }
        `
      });

      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = Math.PI / 2.35;
      mesh.rotation.z = 0.3;
      root.add(mesh);
      return mesh;
    }

    function makeNebula(count = 2400) {
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const sizes = new Float32Array(count);
      const c = new THREE.Color();

      for (let i = 0; i < count; i++) {
        const r = 280 + Math.random() * 1200;
        const theta = Math.random() * Math.PI * 2;
        const phi = (Math.random() - 0.5) * 0.9;

        positions[i * 3 + 0] = Math.cos(theta) * Math.cos(phi) * r;
        positions[i * 3 + 1] = Math.sin(phi) * r * 0.35;
        positions[i * 3 + 2] = Math.sin(theta) * Math.cos(phi) * r;

        const mix = Math.random();
        if (mix < 0.5) c.setHex(0x3a4cff);
        else if (mix < 0.85) c.setHex(0xff8a46);
        else c.setHex(0xffffff);

        colors[i * 3 + 0] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;
        sizes[i] = 18 + Math.random() * 40;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));

      const mat = new THREE.ShaderMaterial({
        uniforms: {
          time: { value: 0 }
        },
        vertexShader: `
          attribute float aSize;
          attribute vec3 color;
          uniform float time;
          varying vec3 vColor;
          varying float vAlpha;
          void main() {
            vColor = color;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            float pulse = 0.7 + 0.3 * sin(time * 0.3 + position.x * 0.002 + position.z * 0.002);
            gl_PointSize = aSize * pulse * (180.0 / -mvPosition.z);
            vAlpha = 0.16 + 0.18 * pulse;
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          precision highp float;
          varying vec3 vColor;
          varying float vAlpha;
          void main() {
            vec2 p = gl_PointCoord - 0.5;
            float d = length(p);
            float a = smoothstep(0.5, 0.0, d) * vAlpha;
            if (a < 0.005) discard;
            gl_FragColor = vec4(vColor, a);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      const points = new THREE.Points(geo, mat);
      scene.add(points);
      return { points, material: mat };
    }

    const stars = makeStarField(9000);
    const nebula = makeNebula(2600);

    const core = makeBlackCore(10.8);
    const innerGlow = makeGlowSphere(14.5, 0x7a5cff, 0.38, 3.5);
    const outerGlow = makeGlowSphere(22.5, 0x3c66ff, 0.16, 3.1);
    const ring = makePhotonRing();
    const jets = makeJets();

    const diskHot = makeDiskGlow(120, 0.16, 0.98, 1.15, 0.92, 2.6, new THREE.Color(0xffd19b), new THREE.Color(0x4e95ff));
    const diskCool = makeDiskGlow(190, 0.20, 0.99, 0.75, 0.55, 7.3, new THREE.Color(0xffa85c), new THREE.Color(0x6cb4ff));
    diskHot.rotation.z = 0.15;
    diskCool.rotation.z = -0.28;
    diskCool.position.y = 0.25;

    const dustInner = makeOrbitDust(6500, 16, 120, 18, 0.9, new THREE.Color(0xffba63), new THREE.Color(0x5d9dff), 1.0);
    const dustOuter = makeOrbitDust(4200, 90, 300, 55, 0.75, new THREE.Color(0xb8c8ff), new THREE.Color(0xff9146), 0.55);
    dustInner.points.rotation.z = 0.18;
    dustOuter.points.rotation.z = -0.12;

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      1.35,
      0.8,
      0.05
    );
    composer.addPass(bloomPass);

    const WarpShader = {
      uniforms: {
        tDiffuse: { value: null },
        time: { value: 0 },
        strength: { value: 0.045 },
        distortion: { value: 0.09 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        precision highp float;
        uniform sampler2D tDiffuse;
        uniform float time;
        uniform float strength;
        uniform float distortion;
        varying vec2 vUv;

        void main() {
          vec2 uv = vUv;
          vec2 c = vec2(0.5, 0.5);
          vec2 p = uv - c;
          float r = length(p);

          float lens = strength / (r * r + 0.08);
          float swirl = distortion / (r + 0.07);

          float a = atan(p.y, p.x) + swirl * 0.07;
          vec2 dir = vec2(cos(a), sin(a));
          vec2 warped = c + dir * (r * (1.0 + lens));

          vec3 col;
          col.r = texture2D(tDiffuse, warped + p * 0.002).r;
          col.g = texture2D(tDiffuse, warped).g;
          col.b = texture2D(tDiffuse, warped - p * 0.002).b;

          float vignette = smoothstep(1.1, 0.15, r);
          col *= vignette;

          float grain = fract(sin(dot(gl_FragCoord.xy + time * 60.0, vec2(12.9898, 78.233))) * 43758.5453) - 0.5;
          col += grain * 0.008;

          gl_FragColor = vec4(col, 1.0);
        }
      `
    };

    const warpPass = new ShaderPass(WarpShader);
    composer.addPass(warpPass);

    const clock = new THREE.Clock();

    function updateDust(dust, delta, time) {
      const pos = dust.positions;
      const count = dust.radii.length;

      for (let i = 0; i < count; i++) {
        const r = dust.radii[i];
        dust.angles[i] += delta * dust.speeds[i] * (0.18 + 12.0 / (r + 15.0));

        const wobble = Math.sin(time * 0.8 + i * 0.017) * 0.8;
        const x = Math.cos(dust.angles[i]) * r;
        const z = Math.sin(dust.angles[i]) * r;
        const y = dust.yOffsets[i] * 0.6 + wobble;

        pos[i * 3 + 0] = x;
        pos[i * 3 + 1] = y;
        pos[i * 3 + 2] = z;
      }

      dust.geo.attributes.position.needsUpdate = true;
    }

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.elapsedTime;

      root.rotation.y = 0.34 + Math.sin(time * 0.12) * 0.03 + pointer.x * 0.06;
      root.rotation.x = -0.28 + Math.sin(time * 0.10) * 0.02 + pointer.y * 0.045;

      controls.update();

      stars.material.uniforms.time.value = time;
      nebula.material.uniforms.time.value = time;
      diskHot.material.uniforms.time.value = time;
      diskCool.material.uniforms.time.value = time;
      innerGlow.material.uniforms.time.value = time;
      outerGlow.material.uniforms.time.value = time;
      ring.material.uniforms.time.value = time;
      jets.children[0].material.uniforms.time.value = time;
      jets.children[1].material.uniforms.time.value = time;
      warpPass.uniforms.time.value = time;

      updateDust(dustInner, delta, time);
      updateDust(dustOuter, delta, time * 0.7);

      dustInner.points.rotation.y += delta * 0.18;
      dustOuter.points.rotation.y -= delta * 0.07;

      diskHot.rotation.z += delta * 0.18;
      diskCool.rotation.z -= delta * 0.11;
      ring.rotation.z += delta * 0.08;

      core.scale.setScalar(1.0 + Math.sin(time * 2.8) * 0.01);
      innerGlow.scale.setScalar(1.0 + Math.sin(time * 1.6) * 0.015);
      outerGlow.scale.setScalar(1.0 + Math.sin(time * 1.2) * 0.01);

      composer.render();
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      bloomPass.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
